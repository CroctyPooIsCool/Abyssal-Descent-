<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abyssal Descent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud"></div>
<div id="w"><canvas id="c"></canvas><div id="pn" hidden></div></div>
<div id="lg"></div>
<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center">
<div class="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k=" ">⚔</button><button data-k="d">▶</button><span></span><button data-k="s">▼</button></div>
<div><button data-k="shift">Roll</button><button data-k="q">Spin</button><button data-k="e">Dagger</button><button data-k="i">Bag</button><button data-k="c">Craft</button><button data-k="j">Lore</button></div></div>
<small>Move: arrows/WASD | Space: combo (hold: slam) | Shift: roll | Q: spin | E: dagger | I C J: menus</small>
